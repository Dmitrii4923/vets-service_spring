server:
  port: ${PORT:8083}
  error:
    include-message: always

spring:
  application:
    name: vets-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak-production-cd3297f4.up.railway.app/realms/hostel}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${MY_HOSTNAME:localhost}
    secure-port-enabled: true
    non-secure-port-enabled: false
    status-page-url: https://${MY_HOSTNAME}/actuator/info
    health-check-url: https://${MY_HOSTNAME}/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: health-portal-vets-service
    description: Сервис врачей

logging:
  level:
    root: INFO
    com.hospital: INFO
